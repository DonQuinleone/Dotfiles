enable-ssh-support

# A window the magnifier and the screen reader can both reach,
# rather than a curses prompt inside whichever terminal asked.
pinentry-program /usr/bin/pinentry-gnome3

# Long enough that a working day costs one prompt per key, short
# enough that a session left alone overnight asks again.
default-cache-ttl 28800
max-cache-ttl 28800
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 28800
