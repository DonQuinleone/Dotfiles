shell /usr/bin/fish
shell_integration enabled no-cursor

font_family      family="JetBrainsMono Nerd Font"
font_size 32
disable_ligatures always

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

mouse_hide_wait 0.5
hide_window_decorations yes
confirm_os_window_close 0

# Centring the grid splits whatever the cells do not fill
# between top and bottom, which at this type size leaves the
# top margin visibly deeper than the sides.
placement_strategy top-left
window_padding_width 10
scrollback_lines 100000

enable_audio_bell no
update_check_interval 0

include /home/user/.local/state/donbox/current/theme/kitty.conf
