// The autoconfig reader discards this first line.
Cu.importGlobalProperties(["IOUtils", "PathUtils"]);

const SHEET_POLL_INTERVAL_MS = 2000;
const CHROME_SCOPE =
    '@-moz-document url-prefix("chrome://"), url-prefix("about:")';
const CHROME_DIRECTORY = "chrome";
const SHEETS = [
    { file: "theme.css", scoped: true },
    { file: "theme-content.css", scoped: false },
];

var sheetService = Cc["@mozilla.org/content/style-sheet-service;1"]
    .getService(Ci.nsIStyleSheetService);
var sheetKind = Ci.nsIStyleSheetService.AGENT_SHEET;
var sheetTimer = Cc["@mozilla.org/timer;1"]
    .createInstance(Ci.nsITimer);
var registered = new Map();

function chromeDirectory() {
    var directory = Services.dirsvc.get("ProfD", Ci.nsIFile);
    directory.append(CHROME_DIRECTORY);
    return directory.path;
}

function sheetURI(css) {
    return Services.io.newURI(
        "data:text/css;charset=utf-8," + encodeURIComponent(css));
}

function retire(uri) {
    if (sheetService.sheetRegistered(uri, sheetKind)) {
        sheetService.unregisterSheet(uri, sheetKind);
    }
}

async function readSheet(sheet) {
    var path = PathUtils.join(chromeDirectory(), sheet.file);
    if (!(await IOUtils.exists(path))) {
        return "";
    }
    var css = await IOUtils.readUTF8(path);
    if (!sheet.scoped) {
        return css;
    }
    return CHROME_SCOPE + " {\n" + css + "\n}";
}

async function syncSheet(sheet) {
    var css = await readSheet(sheet);
    var current = registered.get(sheet.file);
    if (!css || (current && current.css === css)) {
        return;
    }
    if (current) {
        retire(current.uri);
    }
    var uri = sheetURI(css);
    sheetService.loadAndRegisterSheet(uri, sheetKind);
    registered.set(sheet.file, { css: css, uri: uri });
}

async function refreshSheets() {
    for (var sheet of SHEETS) {
        await syncSheet(sheet);
    }
}

sheetTimer.init({ observe: () => refreshSheets() },
    SHEET_POLL_INTERVAL_MS, Ci.nsITimer.TYPE_REPEATING_SLACK);
refreshSheets();
