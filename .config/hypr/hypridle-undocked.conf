# UNDOCKED (battery-lean) profile: laptop panel only, not
# OLED, so burn-in is not a concern. Shorter timings, no
# screensaver phase, straight to lock and screens off, then
# suspend after a while to save battery.
#
# Selected by scripts/idle-profile; do not exec-once this file
# directly, since it is only correct while undocked.

source = ~/.config/hypr/hypridle-common.conf

$UNDOCKED_DIM_TIMEOUT_SECONDS = 120
$UNDOCKED_LOCK_TIMEOUT_SECONDS = 180
$UNDOCKED_DPMS_OFF_TIMEOUT_SECONDS = 240
$UNDOCKED_SUSPEND_TIMEOUT_SECONDS = 900

listener {
    timeout = $UNDOCKED_DIM_TIMEOUT_SECONDS
    on-timeout = brightnessctl -s set $DIM_PERCENT% >/dev/null
    on-resume = brightnessctl -r >/dev/null
}

# loginctl lock-session raises the logind Lock signal, which
# hypridle relays to general.lock_cmd (scripts/idle-lock).
listener {
    timeout = $UNDOCKED_LOCK_TIMEOUT_SECONDS
    on-timeout = loginctl lock-session
}

listener {
    timeout = $UNDOCKED_DPMS_OFF_TIMEOUT_SECONDS
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="disable"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
}

listener {
    timeout = $UNDOCKED_SUSPEND_TIMEOUT_SECONDS
    on-timeout = systemctl suspend
}
