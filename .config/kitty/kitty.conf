shell tmux-run
shell_integration enabled no-cursor

font_family      family="JetBrainsMono Nerd Font"
font_size 32
disable_ligatures always

map ctrl+shift+0 change_font_size all 0

# hints reads whatever is on screen, so these reach a pager
# running on a remote host, which the scrollback cannot.
map ctrl+shift+space kitten hints --type line --program @
map ctrl+shift+p>c kitten hints --type word --program @
map ctrl+shift+p>x kitten hints --type path --program @

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

mouse_hide_wait 0.5

# A mouse_map with no action unbinds the button; these stop the
# mouse pasting or extending a selection by itself.
mouse_map right press ungrabbed
mouse_map shift+right press ungrabbed,grabbed
mouse_map middle release ungrabbed
mouse_map shift+middle release ungrabbed,grabbed

hide_window_decorations yes
confirm_os_window_close 0

# Centring the grid splits whatever the cells do not fill
# between top and bottom, which at this type size leaves the
# top margin visibly deeper than the sides.
placement_strategy top-left
window_padding_width 10
scrollback_lines 100000

enable_audio_bell no
update_check_interval 0

include /home/user/.local/state/theme/kitty.conf
