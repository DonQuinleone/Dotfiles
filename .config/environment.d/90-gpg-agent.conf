# gpg-agent is the one agent for both GPG and SSH. Without it,
# pam_gnome_keyring exports SSH_AUTH_SOCK unconditionally while
# gnome-keyring's ssh component autostarts only under GNOME, so
# nothing ever serves that socket and every key is a prompt.
# A non-default home puts the sockets under a runtime directory
# named after a hash of that path, which this file cannot
# compute, so gpg-agent-ssh-socket.service asks gpgconf and
# publishes the answer instead.
GNUPGHOME=${XDG_DATA_HOME:-${HOME}/.local/share}/gnupg
