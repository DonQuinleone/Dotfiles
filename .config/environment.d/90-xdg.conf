# Firefox reads ~/.mozilla only when it already exists and falls
# back to XDG otherwise, but Fedora's launcher recreates it to
# track langpacks. Nothing here installs Mozilla langpacks, so
# turning that off is what keeps the directory from returning.
MOZ_DISABLE_LANGPACKS=1

NPM_CONFIG_CACHE=${XDG_CACHE_HOME:-${HOME}/.cache}/npm
