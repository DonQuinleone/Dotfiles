enable-ssh-support
allow-preset-passphrase

# A window the magnifier and the screen reader can both reach,
# rather than a curses prompt inside whichever terminal asked.
pinentry-program /usr/bin/pinentry-gnome3

# A preset is capped by max-cache-ttl like any other entry, so
# the ceiling sits past any plausible session and the session
# unit is what clears it, when graphical-session.target stops.
default-cache-ttl 604800
max-cache-ttl 604800
default-cache-ttl-ssh 604800
max-cache-ttl-ssh 604800
