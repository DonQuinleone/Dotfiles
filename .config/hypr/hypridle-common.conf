# Shared by hypridle.conf (docked) and hypridle-undocked.conf.
# Sourced, not duplicated, so both profiles react to a genuine
# sleep event (manual suspend, lid close) the same way even
# though only the undocked profile times its own suspend.

$DIM_PERCENT = 10

general {
    lock_cmd = ~/.config/hypr/scripts/idle-lock
    unlock_cmd =
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}
