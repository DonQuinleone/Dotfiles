set -g default-shell /usr/bin/bash
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-kitty:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

set -g status off
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_LISTEN_ON
set-hook -g after-new-session \
    'run-shell "~/.local/bin/tmux-badge #{session_name}"'
set-hook -g session-window-changed \
    'run-shell "~/.local/bin/tmux-badge #{session_name}"'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

if-shell 'command -v wl-copy' 'set -s copy-command wl-copy' \
    'set -s copy-command pbcopy'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
unbind -n MouseDown2Pane
run-shell "~/.local/bin/tmux-bind-typing"

set -gF @prompt-local '^#{user} [^ ]+ +$'
set -g @prompt-remote '^(\[[^]]*\]|[^ ]+@[^ ]+:[^ ]+)[$#] '
set -sF command-alias[101] "copy-last-output-local=copy-mode ; \
    send -X history-bottom ; \
    send -X start-of-line ; \
    send -X search-backward '#{@prompt-local}' ; \
    send -X search-backward '#{@prompt-local}' ; \
    send -X cursor-down ; send -X cursor-down ; \
    send -X start-of-line ; send -X begin-selection ; \
    send -X search-forward '#{@prompt-local}' ; \
    send -X cursor-up ; send -X end-of-line ; \
    send -X copy-pipe-and-cancel"
set -sF command-alias[102] "copy-last-output-remote=copy-mode ; \
    send -X history-bottom ; \
    send -X start-of-line ; \
    send -X search-backward '#{@prompt-remote}' ; \
    send -X cursor-down ; \
    send -X start-of-line ; send -X begin-selection ; \
    send -X search-forward '#{@prompt-remote}' ; \
    send -X cursor-up ; send -X end-of-line ; \
    send -X copy-pipe-and-cancel"
bind y if -F '#{==:#{pane_current_command},ssh}' \
    copy-last-output-remote copy-last-output-local

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

source-file -q ~/.local/state/theme/tmux.conf
