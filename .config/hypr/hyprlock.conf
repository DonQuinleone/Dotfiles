source = ~/.config/hypr/hyprlock-colours.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
}

background {
    monitor =
    color = $background
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 96
    font_family = $font_ui
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $foreground_dim
    font_size = 22
    font_family = $font_ui
    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $background_alt
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL
    fail_color = $bad
    check_color = $accent
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $foreground_dim
    font_size = 14
    font_family = $font_mono
    position = 0, -140
    halign = center
    valign = center
}
