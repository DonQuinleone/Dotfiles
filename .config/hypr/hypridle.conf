# DOCKED profile: 4K OLED + 1080p on the dock, laptop panel
# secondary. Dim, then screensaver, then screens off. No idle
# suspend: a docked machine is presumed to be doing something
# long-running.
#
# Selected by donbox idle profile; do not exec-once this file
# directly, since it is only correct while docked.

source = ~/.config/hypr/hypridle-common.conf

$DOCKED_DIM_TIMEOUT_SECONDS = 300
$DOCKED_SCREENSAVER_TIMEOUT_SECONDS = 480
$DOCKED_DPMS_OFF_TIMEOUT_SECONDS = 720

listener {
    timeout = $DOCKED_DIM_TIMEOUT_SECONDS
    on-timeout = ~/.local/bin/donbox idle dim $DIM_PERCENT
    on-resume = ~/.local/bin/donbox idle dim restore
}

listener {
    timeout = $DOCKED_SCREENSAVER_TIMEOUT_SECONDS
    on-timeout = ~/.local/bin/donbox idle screensaver start
    on-resume = ~/.local/bin/donbox idle screensaver stop
}

listener {
    timeout = $DOCKED_DPMS_OFF_TIMEOUT_SECONDS
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="disable"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
}
