monitor = ,preferred,auto,1
monitor = desc:Microstep MPG321UX OLED 0x01010101,3840x2160@60.00,0x720,1.5,bitdepth,10
monitor = desc:LG Electronics BL650 201NTFAP0155,1920x1080@60.00,2560x0,1,bitdepth,8
monitor = desc:LG Electronics BL650 201NTJJP0156,1920x1080@60.00,2560x1080,1,bitdepth,8
