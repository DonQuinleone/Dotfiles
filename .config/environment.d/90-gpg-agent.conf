# gpg-agent is the one agent for both GPG and SSH. Without this,
# pam_gnome_keyring exports SSH_AUTH_SOCK unconditionally while
# gnome-keyring's ssh component autostarts only under GNOME, so
# nothing here ever serves that socket and every key is a prompt.
# Kept in sync with the shell exports, which are what a terminal
# started by the compositor picks up instead of this file.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/gnupg/S.gpg-agent.ssh
